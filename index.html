<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz • Bases de Dados Científicas</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#5433a0,#180e3b 75%);color:#fff;font:17px system-ui,Segoe UI,sans-serif;min-height:100vh}main{max-width:1100px;margin:auto;padding:30px 18px}.panel{background:#ffffff13;border:1px solid #ffffff25;border-radius:24px;padding:28px;box-shadow:0 18px 45px #0003}h1{font-size:clamp(28px,5vw,48px);margin:0 0 12px}h2{margin:0 0 18px}.muted{color:#d4cbe9}.center{text-align:center}.pin{font-size:clamp(44px,9vw,90px);letter-spacing:.15em;font-weight:900;color:#ffe275;margin:12px}button,input{font:inherit;border:0;border-radius:12px;padding:14px}input{width:100%;margin:10px 0;background:white;color:#201537}button{cursor:pointer;font-weight:800;background:#ffe275;color:#201537}button:disabled{opacity:.4;cursor:default}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answer{min-height:110px;color:#fff;text-align:left;font-size:clamp(15px,2vw,21px)}.answer:nth-child(1){background:#e21b3c}.answer:nth-child(2){background:#1368ce}.answer:nth-child(3){background:#d89e00;color:#171717}.answer:nth-child(4){background:#26890c}.answer.selected{outline:5px solid white}.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}.avatar{background:#ffffff22;font-size:30px;padding:9px}.avatar.chosen{outline:3px solid #ffe275;background:#fff5}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.rank{padding:10px 0;border-bottom:1px solid #ffffff33}.big{font-size:28px;font-weight:900}.qr{background:white;padding:12px;border-radius:15px;width:min(250px,100%)}.status{color:#ffe275;font-weight:800}.space{margin:24px 0}.pill{background:#ffffff22;padding:8px 14px;border-radius:30px}@media(max-width:600px){.grid{grid-template-columns:1fr}.avatars{grid-template-columns:repeat(5,1fr)}.panel{padding:18px}}</style></head><body><main><div class="bar space"><div><div class="muted">PESQUISA CIENTÍFICA • QUIZ INTERATIVO</div><h1>📚 Bases de Dados</h1></div><span class="pill">11 questões</span></div><section id="host" class="panel hidden"><div class="center" id="lobby"><h2>Entre no quiz pelo celular</h2><img id="qr" class="qr" alt="QR Code de acesso"><div class="muted">Escaneie o QR Code ou acesse o endereço da página</div><div class="pin" id="pin">----</div><div class="muted">PIN da sala • 4 dígitos</div><p id="count">0 participantes</p><button onclick="action('next')">▶ Iniciar perguntas</button></div><div id="hostGame" class="hidden"><div class="bar"><h2 id="hostProgress"></h2><span id="clock" class="big"></span></div><h2 id="hostQuestion"></h2><div class="grid" id="hostAnswers"></div><p id="answered"></p><button onclick="action('next')" id="next">Revelar resposta / próxima questão</button></div><div class="space"><h2>🏆 Classificação</h2><div id="leaderboard"></div></div><button onclick="if(confirm('Reiniciar e remover participantes?'))action('reset')">↻ Reiniciar partida</button></section><section id="join" class="panel hidden"><h2>Entrar na sala</h2><label>PIN de 4 dígitos<input id="joinPin" maxlength="4" inputmode="numeric" placeholder="0000"></label><label>Seu apelido<input id="nick" maxlength="24" placeholder="Como quer ser chamado?"></label><h2>Escolha um avatar</h2><div id="avatars" class="avatars"></div><button onclick="join()">Entrar no quiz →</button><p class="status" id="joinMsg"></p></section><section id="player" class="panel hidden"><div class="bar"><h2 id="playerName"></h2><span id="playerProgress"></span></div><p id="playerStatus" class="status"></p><h2 id="playerQuestion"></h2><div class="grid" id="playerAnswers"></div><p class="muted" id="playerClock"></p></section></main><script>
const AV=['🦊','🐼','🦁','🐯','🐸','🐨','🐵','🐰','🐻','🐺','🦄','🐙','🦋','🐢','🦉','🐧','🦖','🐬','🦈','🐝','🐱','🐶','🐹','🦜','🦩','🐳','🐞','🦝','🐿️','🐲'];let chosen='',token=sessionStorage.getItem('quiz_token'),key=new URLSearchParams(location.search).get('host'),isHost=!!key,lastState=null;const el=id=>document.getElementById(id);function show(id){['host','join','player'].forEach(x=>el(x).classList.toggle('hidden',x!==id))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,data){let r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Falha na comunicação');return j}function drawRanks(s){el('leaderboard').innerHTML=s.players.map((p,i)=>`<div class="rank">${i+1}º ${esc(p.avatar)} <b>${esc(p.nick)}</b> — ${p.score} pontos ${p.answered?'✓':''}</div>`).join('')||'<p class="muted">Aguardando participantes…</p>'}async function action(op){try{await api(op,{key});await poll()}catch(e){alert(e.message)}}async function join(){try{let j=await api('join',{pin:el('joinPin').value,nick:el('nick').value,avatar:chosen});token=j.token;sessionStorage.setItem('quiz_token',token);show('player');await poll()}catch(e){el('joinMsg').textContent=e.message}}async function answer(i){try{await api('answer',{token,choice:i});await poll()}catch(e){el('playerStatus').textContent=e.message}}function render(s){lastState=s;let left=Math.max(0,Math.ceil(s.deadline-(Date.now()/1000+(s.serverTime-Date.now()/1000))));if(isHost){show('host');el('lobby').classList.toggle('hidden',s.phase!=='lobby');el('hostGame').classList.toggle('hidden',s.phase==='lobby');el('count').textContent=s.players.length+' participantes conectados';drawRanks(s);if(s.question){el('hostProgress').textContent=`Questão ${s.index+1} de ${s.total}`;el('hostQuestion').textContent=s.question.text;el('hostAnswers').innerHTML=s.question.answers.map((a,i)=>`<div class="answer" style="padding:18px;border-radius:12px;${s.reveal&&i===s.correct?'outline:5px solid #ffe275':''}">${['▲','◆','●','■'][i]} ${esc(a)}</div>`).join('');el('answered').textContent=s.players.filter(p=>p.answered).length+' de '+s.players.length+' responderam';el('clock').textContent=s.phase==='question'?left+' s':s.phase==='finished'?'Fim':s.phase==='reveal'?'Resposta revelada':'';el('next').textContent=s.phase==='question'?'Mostrar resposta':s.phase==='reveal'?'Próxima questão':s.phase==='finished'?'Quiz encerrado':'Iniciar';el('next').disabled=s.phase==='finished'}else if(s.phase==='finished'){el('hostQuestion').textContent='🏆 Quiz encerrado';el('hostAnswers').innerHTML='';el('clock').textContent=''}}else{show('player');let me=s.players.find(p=>p.id===token);if(!me){sessionStorage.removeItem('quiz_token');token=null;show('join');return}el('playerName').textContent=me.avatar+' '+me.nick+' • '+me.score+' pontos';el('playerProgress').textContent=s.index>=0?`Questão ${s.index+1}/${s.total}`:'';el('playerQuestion').textContent=s.question?.text||'';el('playerAnswers').innerHTML=s.question?s.question.answers.map((a,i)=>`<button class="answer ${s.myAnswer===i?'selected':''}" ${s.phase!=='question'||s.myAnswer!==undefined||left===0?'disabled':''} onclick="answer(${i})">${['▲','◆','●','■'][i]} ${esc(a)}</button>`).join(''):'';el('playerClock').textContent=s.phase==='question'?left+' segundos restantes':'';el('playerStatus').textContent=s.phase==='lobby'?'Aguardando o professor iniciar…':s.phase==='finished'?'🏆 Fim do quiz! Sua pontuação: '+me.score:s.phase==='reveal'?'Resposta correta: '+['vermelha','azul','amarela','verde'][s.correct]:s.myAnswer!==undefined?'Resposta registrada. Aguarde a próxima questão.':'Selecione uma alternativa.'}}async function poll(){try{if(isHost){let x=await api('host?key='+encodeURIComponent(key));el('pin').textContent=x.pin;render(x.state)}else if(token){render(await api('state?token='+encodeURIComponent(token)))}else show('join')}catch(e){if(isHost)el('count').textContent='Erro: '+e.message;else el('joinMsg').textContent=e.message}}if(isHost){el('qr').src='/qr.png';show('host')}else{el('avatars').innerHTML=AV.map(a=>`<button class="avatar" onclick="chosen='${a}';document.querySelectorAll('.avatar').forEach(b=>b.classList.remove('chosen'));this.classList.add('chosen')">${a}</button>`).join('');show(token?'player':'join')}poll();setInterval(poll,1000);
</script></body></html>
